name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality-gates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run lint

      - name: Run tests
        run: npm run test -- --run

      # Security rules run against the Firestore emulator, which needs a JDK.
      - name: Setup Java (Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Firestore rules gate
        run: npm run test:rules

      - name: Build
        run: npm run build

      - name: Governance gate
        run: npm run quality:governance

      - name: Ingestion security gate
        run: npm run quality:ingestion

      - name: Bundle budget gate
        run: npm run quality:bundle

      - name: Route budget gate
        run: npm run quality:routes
