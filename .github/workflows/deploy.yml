name: Build & Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Deploy to Hostinger via SFTP
        timeout-minutes: 8
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          python3 - <<'PYEOF'
          import os, subprocess, sys

          server = os.environ['FTP_SERVER']
          user   = os.environ['FTP_USERNAME']
          pwd    = os.environ['FTP_PASSWORD']
          remote = os.environ['FTP_SERVER_DIR'].strip('/')

          cmds = [
              'set sftp:auto-confirm yes',
              'set net:timeout 60',
              f'mkdir -p /{remote}',
          ]
          for dirpath, dirs, files in os.walk('./dist'):
              rel  = os.path.relpath(dirpath, './dist')
              rdir = remote + ('/' + rel if rel != '.' else '')
              if rel != '.':
                  cmds.append(f'mkdir -p /{rdir}')
              for f in sorted(files):
                  lf = os.path.join(dirpath, f)
                  rf = '/' + rdir + '/' + f
                  print(f'  PUT {rf}', flush=True)
                  cmds.append(f'put {lf} {rf}')
          cmds.append('quit')

          r = subprocess.run(
              ['lftp', '-u', f'{user},{pwd}', f'sftp://{server}:65002',
               '-e', '; '.join(cmds)]
          )
          sys.exit(r.returncode)
          PYEOF
