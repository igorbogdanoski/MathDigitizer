name: Build & Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Delete remote files before fresh upload
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          lftp -u "$FTP_USER,$FTP_PASS" "$FTP_HOST" << EOF
          set ftp:ssl-allow no
          set ftp:use-mlsd no
          set ftp:use-mdtm no
          set ftp:set-permissions no
          set net:timeout 30
          set net:max-retries 2
          cd $FTP_DIR
          glob -a rm -r *
          bye
          EOF

      - name: Upload fresh files via lftp put (no mirror scan)
        timeout-minutes: 15
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          cd $GITHUB_WORKSPACE/dist

          # Build lftp script: mkdir subdirs, then put every file
          {
            echo "set ftp:ssl-allow no"
            echo "set ftp:use-mlsd no"
            echo "set ftp:use-mdtm no"
            echo "set ftp:set-permissions no"
            echo "set net:timeout 60"
            echo "set net:max-retries 3"
            echo "cd $FTP_DIR"
            # Create subdirectories first
            find . -mindepth 1 -type d | sed 's|^\./||' | sort | while read -r d; do
              echo "mkdir -p \"$d\""
            done
            # Upload every file
            find . -type f | sed 's|^\./||' | while read -r f; do
              echo "put \"$GITHUB_WORKSPACE/dist/$f\" -o \"$f\""
            done
            echo "bye"
          } | lftp -u "$FTP_USER,$FTP_PASS" "$FTP_HOST"

      - name: Fix file permissions via FTP
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          lftp -u "$FTP_USER,$FTP_PASS" "$FTP_HOST" << EOF
          set ftp:ssl-allow no
          cd $FTP_DIR
          chmod 755 .
          glob chmod 755 */
          glob chmod 644 *.html *.json *.xml *.txt *.svg *.png *.ico *.webmanifest *.js
          glob chmod 644 .htaccess
          cd assets
          glob chmod 644 *.js *.css *.png *.svg *.ico *.woff *.woff2
          bye
          EOF

      - name: Verify deployment
        run: |
          sleep 5
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://math.mismath.net/)
          SIZE=$(curl -s https://math.mismath.net/ | wc -c)
          LM=$(curl -sI https://math.mismath.net/ | grep -i "last-modified")
          echo "HTTP status: $STATUS | index.html size: $SIZE bytes"
          echo "$LM"
