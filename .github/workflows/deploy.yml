name: Build & Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          VITE_ADMIN_EMAIL: ${{ secrets.VITE_ADMIN_EMAIL }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      - name: Capture build fingerprint
        id: fingerprint
        run: |
          BUNDLE=$(grep -oE '/assets/index-[a-zA-Z0-9_-]+\.js' "$GITHUB_WORKSPACE/dist/index.html" | head -1)
          if [ -z "$BUNDLE" ]; then
            echo "Could not find a main JS bundle reference in dist/index.html — build is broken." >&2
            exit 1
          fi
          echo "bundle=$BUNDLE" >> "$GITHUB_OUTPUT"
          echo "Built bundle: $BUNDLE"

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Deploy via lftp direct puts (zero remote listing)
        timeout-minutes: 30
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          cd $GITHUB_WORKSPACE/dist

          # FTP_DIR must be set to domains/mismath.net/public_html/math
          # (relative to the FTP login root, no leading slash) — this
          # account's FTP login lands in a different location than the
          # actual document root Hostinger serves for math.mismath.net.
          # See docs/DEPLOY_TROUBLESHOOTING.md for how this was confirmed.
          CD_CMD=""
          if [ -n "$FTP_DIR" ]; then
            CD_CMD="cd $FTP_DIR"
          fi

          # Phase 1 (best-effort, no fail-exit): clean up legacy filenames and
          # ensure directories exist. mkdir legitimately "fails" every run
          # once a directory already exists from a prior deploy — that's not
          # a real error, so this phase must NOT abort on it.
          {
            echo "set ftp:ssl-allow no"
            echo "set ftp:use-mlsd no"
            echo "set ftp:use-mdtm no"
            echo "set net:timeout 60"
            echo "set net:max-retries 3"
            if [ -n "$CD_CMD" ]; then
              echo "$CD_CMD"
            fi
            # Hostinger's FTP does not overwrite. STOR on a file that already
            # exists returns 226, and the old bytes stay. Only creating a file
            # that is not there works, so anything keeping its name across
            # deploys has to be removed first or it silently stays at whatever
            # it was the first time it landed.
            #
            # This list used to be six hardcoded names, which meant every other
            # stable-named file was frozen on the server. It cost us
            # og-image.png: the pre-redesign card — 8 KB, no text on it at all —
            # was still what every previously shared link resolved to, months
            # and many green deploys after the card was redrawn. sitemap.xml,
            # robots.txt, the PWA icons and the per-route share cards were all
            # sitting in the same trap.
            #
            # Everything under assets/ is content-hashed, so a change arrives
            # under a new name and is always a create — those must NOT be
            # deleted, or the currently-live page loses the chunks it is asking
            # for during the upload window.
            echo "rm -f .ftp-deploy-sync-state.json"
            find . -type f -not -path './assets/*' | sed 's|^\./||' | sort | while read -r f; do
              echo "rm -f \"$f\""
            done
            find . -mindepth 1 -type d | sed 's|^\./||' | sort | while read -r d; do
              echo "mkdir -p \"$d\""
            done
            echo "bye"
          } | lftp -u "$FTP_USER,$FTP_PASS" "$FTP_HOST" || true
          # ^ GitHub Actions runs this script with `bash -e`, so lftp's own
          # exit code (non-zero whenever ANY queued command failed, even
          # without cmd:fail-exit, it just doesn't abort the batch early)
          # would otherwise kill this step on the very "already exists"
          # mkdir noise phase 1 is meant to tolerate. Phase 2 below must NOT
          # have this — its failures are the ones that should actually stop
          # the deploy.

          # Phase 2 (fail-exit yes): the actual upload. This must succeed for
          # every file, so a bad login/path/permission now aborts the step
          # instead of silently leaving stale content live.
          for attempt in 1 2 3; do
            echo "FTP upload attempt $attempt/3"
            if {
              echo "set ftp:ssl-allow no"
              echo "set ftp:use-mlsd no"
              echo "set ftp:use-mdtm no"
              echo "set net:timeout 45"
              echo "set net:max-retries 2"
              echo "set cmd:fail-exit yes"
              if [ -n "$CD_CMD" ]; then
                echo "$CD_CMD"
              fi
              find . -type f | sed 's|^\./||' | while read -r f; do
                echo "put \"$GITHUB_WORKSPACE/dist/$f\" -o \"$f\""
              done
              # Prove the upload actually landed, from the server's own
              # perspective, inside this same authenticated session — no HTTP
              # cache layer can lie about this the way it can for a curl check.
              echo "ls -la index.html"
              echo "bye"
            } | lftp -u "$FTP_USER,$FTP_PASS" "$FTP_HOST"; then
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Upload failed after 3 attempts." >&2
              exit 1
            fi

            sleep 10
          done

      - name: Fix file permissions
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          cd $GITHUB_WORKSPACE/dist
          {
            echo "set ftp:ssl-allow no"
            echo "set ftp:use-mlsd no"
            echo "set ftp:use-mdtm no"
            echo "set net:timeout 30"
            if [ -n "$FTP_DIR" ]; then
              echo "cd $FTP_DIR"
            fi
            echo "chmod 755 ."
            find . -maxdepth 1 -type f | sed 's|^\./||' | while read -r f; do
              echo "chmod 644 \"$f\""
            done
            find . -mindepth 1 -type d | sed 's|^\./||' | while read -r d; do
              echo "chmod 755 \"$d\""
            done
            find . -mindepth 2 -type f | sed 's|^\./||' | while read -r f; do
              echo "chmod 644 \"$f\""
            done
            echo "bye"
          } | lftp -u "$FTP_USER,$FTP_PASS" "$FTP_HOST"

      - name: Verify deployment
        env:
          EXPECTED_BUNDLE: ${{ steps.fingerprint.outputs.bundle }}
        run: |
          echo "Expecting live index.html to reference: $EXPECTED_BUNDLE"

          for attempt in 1 2 3 4 5 6; do
            sleep 10
            LIVE_HTML=$(curl -s --max-time 20 "https://math.mismath.net/?cachebust=$(date +%s)")
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 https://math.mismath.net/)
            LIVE_BUNDLE=$(echo "$LIVE_HTML" | grep -oE '/assets/index-[a-zA-Z0-9_-]+\.js' | head -1)
            echo "Attempt $attempt: HTTP $STATUS, live bundle: ${LIVE_BUNDLE:-<none found>}"

            if [ "$LIVE_BUNDLE" = "$EXPECTED_BUNDLE" ]; then
              echo "Verified: live site is serving the bundle just deployed."
              BUNDLE_OK=1
              break
            fi
          done

          if [ -z "$BUNDLE_OK" ]; then
            echo "::error::Deployment verification failed — after 6 attempts (~60s) the live site at https://math.mismath.net/ is still not serving $EXPECTED_BUNDLE. The lftp step reported success, but the uploaded files are not visible on the live site. Check that the FTP_SERVER_DIR secret points at the actual document root for math.mismath.net." >&2
            exit 1
          fi

          # The share cards, checked from outside.
          #
          # A stale card is invisible from every angle this job had until now:
          # the bundle hash was fresh, the HTML was right, and the image the
          # whole internet saw was still the 8 KB one with no text on it. It is
          # only visible by fetching the bytes, so fetch the bytes. 40 KB is the
          # same floor src/lib/ogImages.test.ts holds the committed files to —
          # a real 1200x630 card is ~180 KB, flat colour compresses to single
          # digits.
          CARDS_OK=1
          for CARD in /og-image.png /og/default.png /og/pricing.png \
                      /og/blog-ocr-matematika.png /og/blog-latex-ekstrakcija.png \
                      /og/blog-live-mathkahoot.png; do
            BYTES=$(curl -s --max-time 20 -o /dev/null -w '%{size_download}' \
              "https://math.mismath.net${CARD}?cachebust=$(date +%s)")

            if [ "${BYTES:-0}" -gt 40000 ]; then
              echo "  ${CARD} — $((BYTES / 1024)) KB"
            else
              echo "::error::${CARD} is ${BYTES:-0} bytes on the live site — too flat to hold text, so the upload did not replace it."
              CARDS_OK=""
            fi
          done

          if [ -z "$CARDS_OK" ]; then
            echo "::error::Share cards on the live site are stale. Hostinger's FTP silently keeps the old bytes when a file already exists; check that the deploy step's delete-first phase ran." >&2
            exit 1
          fi

          echo "Verified: bundle and all six share cards are live."
