name: Build & Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Deploy via lftp direct puts (zero remote listing)
        timeout-minutes: 20
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          cd $GITHUB_WORKSPACE/dist

          {
            echo "set ftp:ssl-allow no"
            echo "set ftp:use-mlsd no"
            echo "set ftp:use-mdtm no"
            echo "set ftp:set-permissions no"
            echo "set net:timeout 60"
            echo "set net:max-retries 3"
            echo "cd $FTP_DIR"
            for f in index.html .htaccess vite.svg robots.txt manifest.json .ftp-deploy-sync-state.json; do
              echo "rm -f $f"
            done
            find . -mindepth 1 -type d | sed 's|^\./||' | sort | while read -r d; do
              echo "mkdir -p \"$d\""
            done
            find . -type f | sed 's|^\./||' | while read -r f; do
              echo "put \"$GITHUB_WORKSPACE/dist/$f\" -o \"$f\""
            done
            echo "bye"
          } | lftp -u "$FTP_USER,$FTP_PASS" "$FTP_HOST"

      - name: Fix file permissions
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          cd $GITHUB_WORKSPACE/dist
          {
            echo "set ftp:ssl-allow no"
            echo "set ftp:use-mlsd no"
            echo "set ftp:use-mdtm no"
            echo "set net:timeout 30"
            echo "cd $FTP_DIR"
            echo "chmod 755 ."
            find . -maxdepth 1 -type f | sed 's|^\./||' | while read -r f; do
              echo "chmod 644 \"$f\""
            done
            find . -mindepth 1 -type d | sed 's|^\./||' | while read -r d; do
              echo "chmod 755 \"$d\""
            done
            find . -mindepth 2 -type f | sed 's|^\./||' | while read -r f; do
              echo "chmod 644 \"$f\""
            done
            echo "bye"
          } | lftp -u "$FTP_USER,$FTP_PASS" "$FTP_HOST"

      - name: Verify deployment
        run: |
          sleep 5
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://math.mismath.net/)
          SIZE=$(curl -s https://math.mismath.net/ | wc -c)
          LM=$(curl -sI https://math.mismath.net/ | grep -i "last-modified")
          echo "HTTP status: $STATUS | index.html size: $SIZE bytes"
          echo "$LM"
