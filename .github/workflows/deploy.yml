name: Build & Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}

      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Deploy to Hostinger via SFTP
        timeout-minutes: 8
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          python3 -c "
          import os
          remote = os.environ['FTP_SERVER_DIR'].strip('/')
          lines = []
          for dirpath, dirs, files in os.walk('./dist'):
              rel = os.path.relpath(dirpath, './dist')
              rdir = remote + ('/' + rel if rel != '.' else '')
              lines.append(f'-mkdir /{rdir}')
              for f in sorted(files):
                  lf = os.path.join(dirpath, f)
                  rf = '/' + rdir + '/' + f
                  lines.append(f'put {lf} {rf}')
          lines.append('quit')
          print('\n'.join(lines))
          " > /tmp/sftp-batch.txt

          export SSHPASS="$FTP_PASSWORD"
          sshpass -e sftp \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o PubkeyAuthentication=no \
            -o PreferredAuthentications=password \
            -P 65002 \
            -b /tmp/sftp-batch.txt \
            "$FTP_USERNAME@$FTP_SERVER"
