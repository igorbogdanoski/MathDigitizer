<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="50%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1e40af" stroke-width="0.5" opacity="0.3"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Radial glow top-left -->
  <radialGradient id="glow1" cx="200" cy="200" r="350" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.25"/>
    <stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="630" fill="url(#glow1)"/>

  <!-- Radial glow bottom-right -->
  <radialGradient id="glow2" cx="1050" cy="500" r="300" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.2"/>
    <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Decorative math symbols (background, subtle) -->
  <text x="820" y="200" font-family="Georgia, serif" font-size="180" fill="white" opacity="0.04" transform="rotate(-10, 900, 200)">∫</text>
  <text x="950" y="420" font-family="Georgia, serif" font-size="140" fill="white" opacity="0.04">∑</text>
  <text x="70" y="560" font-family="Georgia, serif" font-size="120" fill="white" opacity="0.04">π</text>

  <!-- Logo circle -->
  <circle cx="90" cy="110" r="44" fill="#4f46e5" opacity="0.9"/>
  <text x="90" y="121" font-family="Georgia, serif" font-size="32" fill="white" text-anchor="middle" font-weight="bold">M</text>

  <!-- Brand badge -->
  <rect x="148" y="88" width="260" height="44" rx="22" fill="#1e3a8a" opacity="0.6"/>
  <text x="278" y="116" font-family="-apple-system, system-ui, sans-serif" font-size="17" fill="#93c5fd" text-anchor="middle" font-weight="700" letter-spacing="2">MathDigitizer Pro</text>

  <!-- Main headline -->
  <text x="80" y="290" font-family="-apple-system, system-ui, Segoe UI, sans-serif" font-size="76" font-weight="900" fill="url(#brand)" letter-spacing="-2">Помалку хаос.</text>
  <text x="80" y="385" font-family="-apple-system, system-ui, Segoe UI, sans-serif" font-size="76" font-weight="900" fill="white" letter-spacing="-2">Повеќе математика.</text>

  <!-- Subtitle -->
  <text x="80" y="450" font-family="-apple-system, system-ui, sans-serif" font-size="30" fill="#94a3b8" font-weight="500">Teacher-first AI платформа за математика на македонски јазик</text>

  <!-- Divider -->
  <rect x="80" y="490" width="600" height="2" rx="1" fill="url(#accent)" opacity="0.4"/>

  <!-- Feature pills -->
  <rect x="80" y="515" width="165" height="42" rx="21" fill="#312e81" opacity="0.8"/>
  <text x="163" y="542" font-family="-apple-system, system-ui, sans-serif" font-size="16" fill="#a5b4fc" text-anchor="middle" font-weight="600">AI Екстракција</text>

  <rect x="260" y="515" width="185" height="42" rx="21" fill="#312e81" opacity="0.8"/>
  <text x="353" y="542" font-family="-apple-system, system-ui, sans-serif" font-size="16" fill="#a5b4fc" text-anchor="middle" font-weight="600">Live Classroom</text>

  <rect x="460" y="515" width="185" height="42" rx="21" fill="#312e81" opacity="0.8"/>
  <text x="553" y="542" font-family="-apple-system, system-ui, sans-serif" font-size="16" fill="#a5b4fc" text-anchor="middle" font-weight="600">Auto Grader</text>

  <!-- URL / domain -->
  <text x="80" y="600" font-family="-apple-system, system-ui, sans-serif" font-size="22" fill="#475569" font-weight="500" letter-spacing="1">mathdigitizer.pro</text>

  <!-- Price badge right side -->
  <rect x="900" y="380" width="240" height="120" rx="24" fill="#1e3a8a" opacity="0.7"/>
  <rect x="900" y="380" width="240" height="120" rx="24" fill="none" stroke="#4f46e5" stroke-width="1.5" opacity="0.6"/>
  <text x="1020" y="426" font-family="-apple-system, system-ui, sans-serif" font-size="14" fill="#93c5fd" text-anchor="middle" font-weight="700" letter-spacing="2">PRO TEACHER</text>
  <text x="1020" y="472" font-family="-apple-system, system-ui, sans-serif" font-size="40" fill="white" text-anchor="middle" font-weight="900">490 MKD</text>
  <text x="1020" y="498" font-family="-apple-system, system-ui, sans-serif" font-size="16" fill="#64748b" text-anchor="middle">месечно</text>
</svg>
